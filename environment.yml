name: ipi

# 只声明跨平台的顶层依赖。不要把某台机器导出的底层库写进来，
# Conda 会根据当前平台（如 osx-arm64 / linux-64）自动选择实现。
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - pip:
      # AgentDojo 与模型调用
      - agentdojo==0.1.35
      - dashscope==1.25.6
      - openai==2.14.0
      - pydantic==2.12.5
      - tomli==2.4.0

      # Dashboard 与绘图
      - flask==3.1.2
      - matplotlib==3.10.8
      - numpy==2.2.6
