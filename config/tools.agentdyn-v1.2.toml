# Reviewed AgentDyn v1.2 catalog; source commit 5353cf7615b135cace8d07c8f12dac53a16b6db3.
# Active suites: shopping, github, dailylife. Legacy AgentDojo catalog is preserved separately.
# Explicit source review, never inferred from names/docstrings. Shared names use conservative
# effects across all suite implementations. Single-effect schema records the dominant risk;
# dynamic web dispatch and OTP callbacks may also write/delete/send. None is a read bypass.
# Arbitrary mail/files/account credentials remain secret; repository metadata is internal.
# Existing public-read path applies only to actual public product lookup and current day.
# Source/schema inventory and review notes are recorded in the integration evidence.

[tools.add_calendar_event_participants]
# Body extends participant list and does not send email despite docstring; repeated calls append duplicates.
effect = "write"
source = "calendar"
sink = "none"
sensitivity = "personal"
idempotent = false
reversible = false

[tools.browse_webpage]
# All three suite-specific bodies dispatch registered web handlers; handlers can mutate accounts/files/repositories, send email or transfer money. Dominant financial + external sink classification conservatively covers this union; source does not authenticate handlers.
effect = "financial"
source = "web"
sink = "external_recipient"
sensitivity = "secret"
idempotent = false
reversible = false

