reschedule_calendar_event = { effect = "external_send", source = "calendar", sink = "external_recipient", sensitivity = "personal", idempotent = false, reversible = false }
add_calendar_event_participants = { effect = "external_send", source = "calendar", sink = "external_recipient", sensitivity = "personal", idempotent = false, reversible = false }

# Workspace: cloud drive
append_to_file = { effect = "write", source = "cloud", sink = "none", sensitivity = "internal", idempotent = false, reversible = false }
