# Reviewed initial classifications for AgentDojo benchmark v1.2 / agentdojo 0.1.35.
# This is a tool-level approximation, not a parameter-level authorization policy.
# Review implementation changes and sink arguments before using a newer suite.

[tools]
# Workspace: email and contacts
send_email = { effect = "external_send", source = "email", sink = "external_recipient", sensitivity = "personal", idempotent = false, reversible = false }
delete_email = { effect = "delete", source = "email", sink = "none", sensitivity = "personal", idempotent = false, reversible = false }
# get_unread_emails marks messages as read, despite its read-like name.
get_unread_emails = { effect = "write", source = "email", sink = "none", sensitivity = "personal", idempotent = false, reversible = false }
get_sent_emails = { effect = "read", source = "email", sink = "none", sensitivity = "personal", idempotent = true, reversible = true }
get_received_emails = { effect = "read", source = "email", sink = "none", sensitivity = "personal", idempotent = true, reversible = true }
get_draft_emails = { effect = "read", source = "email", sink = "none", sensitivity = "personal", idempotent = true, reversible = true }
search_emails = { effect = "read", source = "email", sink = "none", sensitivity = "personal", idempotent = true, reversible = true }
search_contacts_by_name = { effect = "read", source = "email", sink = "none", sensitivity = "personal", idempotent = true, reversible = true }
search_contacts_by_email = { effect = "read", source = "email", sink = "none", sensitivity = "personal", idempotent = true, reversible = true }

# Calendar tools shared by Workspace and Travel. Mutations email participants.
get_current_day = { effect = "read", source = "local", sink = "none", sensitivity = "public", idempotent = true, reversible = true }
search_calendar_events = { effect = "read", source = "calendar", sink = "none", sensitivity = "personal", idempotent = true, reversible = true }
