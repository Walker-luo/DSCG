# Copy this file to config/models.local.toml and fill in your own keys.
# config/models.local.toml is ignored by Git.

[main]
provider = "dashscope"
model_id = "qwen3.7-flash"
# api_key = "YOUR_API_KEY"  # Optional local-only secret; prefer api_key_env for shared machines.

[security]
provider = "dashscope"
model_id = "qwen3.7-flash"

[providers.deepseek]
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"

[providers.dashscope]
base_url = "https://llm-mlss3za0e68dhn8x.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"
# api_key = "YOUR_DASHSCOPE_API_KEY"

[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.moonshot]
base_url = "https://api.moonshot.cn/v1"
api_key_env = "MOONSHOT_API_KEY"

[providers.zhipu]
base_url = "https://open.bigmodel.cn/api/paas/v4"
api_key_env = "ZHIPUAI_API_KEY"

[providers.siliconflow]
base_url = "https://api.siliconflow.cn/v1"
api_key_env = "SILICONFLOW_API_KEY"

[providers.groq]
base_url = "https://api.groq.com/openai/v1"
