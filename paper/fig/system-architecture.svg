<svg xmlns="http://www.w3.org/2000/svg" width="183mm" height="99.72mm" viewBox="0 0 519 283" role="img" aria-labelledby="dscg-title dscg-desc">
<title id="dscg-title">DSCG mediated tool-use architecture</title>
<desc id="dscg-desc">The agent compiles task-level tool permissions, plans tool calls, checks and audits candidates, then uses a reference monitor and ticketed executor before feeding isolated tool results back to the planner.</desc>
